# Lint and production build (the build also type-checks) on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Blocks commits that contain passwords, tokens or keys (scans the whole history of the branch)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The production image: built on every pull request (and started once), pushed to
  # ghcr.io/ilutov90/premium-cars-frontend on main as :latest and :<commit>. The server pulls it when deployed.
  image:
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            API_URL=http://backend:8080
            SITE_URL=https://premiumcarsimport.bg
          tags: |
            ghcr.io/ilutov90/premium-cars-frontend:latest
            ghcr.io/ilutov90/premium-cars-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and serves pages (no backend here, so the data parts are empty)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name web -p 3000:3000 ghcr.io/ilutov90/premium-cars-frontend:latest
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/admin && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/admin | grep -q "Premium Cars"
          docker exec web id -un | grep -qx node
          docker logs web
